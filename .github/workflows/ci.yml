name: API tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out test framework
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'


      - name: Install test framework (pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Allure dependencies
        run: |
          npm ci  
          

      - name: Clone restful-booker-platform
        uses: actions/checkout@v6
        with:
          repository: mwinteringham/restful-booker-platform
          ref: trunk
          path: restful-booker-platform
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start microservices with docker-compose
        run: |
          cd restful-booker-platform
          docker compose up -d

      - name: Wait for all services to be healthy
        run: python scripts/wait_for_services.py

      - name: Create .env file from GitHub Secrets
        run: |
          cat << 'EOF' > .env
          BOOKING.URL=${{ secrets.BOOKING_URL }}
          AUTH.URL=${{ secrets.AUTH_URL }}
          ROOM.URL=${{ secrets.ROOM_URL }}
          REPORT.URL=${{ secrets.REPORT_URL }}
          BRANDING.URL=${{ secrets.BRANDING_URL }}
          MESSAGE.URL=${{ secrets.MESSAGE_URL }}

          HTTP_CLIENT.TIMEOUT=${{ secrets.HTTP_CLIENT_TIMEOUT }}
          HTTP_CLIENT.RETRIES=${{ secrets.HTTP_CLIENT_RETRIES }}
          HTTP_CLIENT.VERIFY_SSL=${{ secrets.HTTP_CLIENT_VERIFY_SSL }}

          TEST_USER.LOGIN=${{ secrets.TEST_USER_LOGIN }}
          TEST_USER.PASSWORD=${{ secrets.TEST_USER_PASSWORD }}
          EOF

      - name: Run API tests with pytest and generate Allure results
        run: python -m pytest tests/  --alluredir=allure-results

      - name: Restore Coverage history
        uses: actions/cache/restore@v5
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run_id }}
          restore-keys: |
            coverage-history-


      - name: Generate Coverage report
        run: |
          swagger-coverage-tool save-report


      - name: Cache Coverage history
        if: always()
        uses: actions/cache/save@v5
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run_id }}

      - name: Upload Coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.html


      - name: Restore Allure history
        run: |
          curl -s -L https://raw.githubusercontent.com/lobanov-qa/pytest-booker-platform-api/gh-pages/history.jsonl -o history.jsonl


      - name: Generate Allure report
        run: |
          npx allure generate allure-results


      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report

      - name: Upload Allure history
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-history-jsonl
          path: history.jsonl

      - name: Upload Index
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: index
          path: .github/templates/

      - name: Cleanup (always run)
        if: always()
        run: |
          cd restful-booker-platform 2>/dev/null && docker compose down -v --remove-orphans || true

  publish-report:
    if: always()
    needs: [ setup-and-validate ]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v7
        with:
          name: allure-report
          path: allure-report

      - name: Download Allure history
        uses: actions/download-artifact@v7
        with:
          name: allure-history-jsonl
          path: .

      - name: Download Swagger Coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: coverage-report

      - name: Download Index
        uses: actions/download-artifact@v7
        with:
          name: index
          path: templates

      - name: Check out gh-pages for structure
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Prepare unified reports structure
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          mkdir -p public
          mkdir -p public/allure/
          mkdir -p public/coverage/

          cp -r allure-report/* public/allure/ || (echo "❌ Allure report not found" && exit 1)
          cp coverage-report/coverage.html public/coverage/index.html || (echo "❌ coverage.html not found" && exit 1)
          cp -r gh-pages/zudoku-doc public/
          cp gh-pages/.nojekyll public/
          cp history.jsonl public/
          cp templates/dashboard-template.html public/index.html
          sed -i "s/\$BUILD_NUMBER/$BUILD_NUMBER/g" public/index.html     

      - name: Deploy unified reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          keep_files: false




